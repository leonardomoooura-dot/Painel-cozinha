<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel da Cozinha — Casa do Crepe</title>
<style>
:root{--red:#b51f18;--dark:#74140f;--yellow:#f5c928;--cream:#fff7e8;--paper:#fffdf8;--text:#3b2922;--muted:#78675f;--line:#ead9bf;--green:#2f7d32;--orange:#d97817;--blue:#2867a8;--shadow:0 5px 18px rgba(90,50,20,.10)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.top{height:8px;background:linear-gradient(90deg,var(--red) 0 72%,var(--yellow) 72%)}

header{
  background:var(--red);
  color:white;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 3px 12px #0002
}

.head{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}

.title{font-size:25px;font-weight:900}
.sub{font-size:13px;opacity:.9;margin-top:3px}

.live{
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:800;
  font-size:13px;
  background:#ffffff1c;
  padding:8px 10px;
  border-radius:999px
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#8df08d;
  box-shadow:0 0 8px #8df08d
}

main{
  max-width:1100px;
  margin:20px auto;
  padding:0 14px 40px
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px
}

.count{font-weight:900}

.filters{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.filters button,.actions button{
  border:1px solid var(--line);
  background:var(--paper);
  padding:9px 12px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
  color:var(--text)
}

.filters button.active{
  background:var(--dark);
  color:white;
  border-color:var(--dark)
}

.orders{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px
}

.section-title{
  grid-column:1/-1;
  margin:8px 0 0;
  color:var(--dark);
  font-size:19px;
  font-weight:900
}

.section-title.printed{
  margin-top:24px;
  border-top:2px solid var(--line);
  padding-top:18px
}

.empty{
  grid-column:1/-1;
  text-align:center;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:35px;
  color:var(--muted)
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
  overflow:hidden
}

.card.new{
  border:2px solid var(--yellow);
  animation:pop .45s ease
}

@keyframes pop{
  0%{transform:scale(.98)}
  100%{transform:scale(1)}
}

.cardhead{
  padding:14px 15px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:10px
}

.orderid{font-weight:900}

.time{
  font-size:12px;
  color:var(--muted);
  margin-top:4px
}

.status{
  font-size:12px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  height:max-content
}

.novo{background:#fff0a8}
.aceito{background:#dcecff;color:#174f85}
.preparando{background:#ffe1bc;color:#8a4b00}
.pronto{background:#dff3df;color:#246526}
.entregue{background:#e5e5e5;color:#555}
.cancelado{background:#ffdede;color:#9a2222}

.body{padding:14px 15px}

.customer{font-weight:900}

.address{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
  line-height:1.35
}

.items{
  margin:14px 0 0;
  padding:0;
  list-style:none
}

.item{
  padding:10px 0;
  border-bottom:1px solid #eee0ce
}

.item:last-child{border-bottom:0}

.qty{font-weight:900}

.cat{
  font-size:11px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:900;
  margin-bottom:3px
}

.addons{
  font-size:12px;
  color:#765b4e;
  margin-top:3px
}

.total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid var(--line);
  padding-top:12px;
  margin-top:5px;
  font-size:18px;
  font-weight:900
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  padding:12px 15px;
  background:#fff9ef;
  border-top:1px solid var(--line)
}

.actions button{
  flex:1;
  min-width:110px
}

.actions .primary{
  background:var(--dark);
  color:white;
  border-color:var(--dark)
}

.actions .ready{
  background:var(--green);
  color:white;
  border-color:var(--green)
}

.actions .cancel{color:#a21e1e}

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:var(--dark);
  color:white;
  padding:13px 16px;
  border-radius:10px;
  box-shadow:0 5px 20px #0004;
  display:none;
  font-weight:800;
  z-index:30
}

.toast.show{display:block}

@media(max-width:720px){
  .orders{grid-template-columns:1fr}
  .head{align-items:flex-start}
  .title{font-size:21px}
  .live{font-size:11px}
  .toolbar{
    align-items:flex-start;
    flex-direction:column
  }
  .filters{width:100%}
  .filters button{flex:1}
}

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:var(--cream)
}

.login-box{
  width:min(420px,100%);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:24px
}

.login-box h1{
  margin:0;
  color:var(--dark);
  font-size:25px
}

.login-box p{
  color:var(--muted);
  font-size:14px;
  margin:7px 0 20px
}

.login-box label{
  display:block;
  font-weight:800;
  font-size:13px;
  margin:12px 0 6px
}

.login-box input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:9px;
  font-size:16px;
  background:#fff
}

.login-box button{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:9px;
  padding:12px;
  background:var(--dark);
  color:#fff;
  font-weight:900;
  font-size:15px;
  cursor:pointer
}

.login-error{
  color:#a21e1e;
  font-size:13px;
  font-weight:700;
  margin-top:10px;
  min-height:18px
}

.hidden{display:none!important}

.logout{
  border:1px solid #ffffff55;
  background:#ffffff18;
  color:#fff;
  border-radius:9px;
  padding:8px 10px;
  font-weight:800;
  cursor:pointer
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <form class="login-box" id="loginForm">
    <h1>Casa do Crepe</h1>
    <p>Acesso restrito ao painel da cozinha.</p>

    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button type="submit">Entrar no painel</button>

    <div class="login-error" id="loginError"></div>
  </form>
</div>

<div id="app" class="hidden">

  <div class="top"></div>

  <header>
    <div class="head">

      <div>
        <div class="title">Casa do Crepe</div>
        <div class="sub">Painel da cozinha</div>
      </div>

      <div style="display:flex;align-items:center;gap:8px">
        <div class="live">
          <span class="dot"></span>
          Pedidos em tempo real
        </div>

        <button class="logout" id="logoutBtn">
          Sair
        </button>
      </div>

    </div>
  </header>

  <main>

    <div class="toolbar">

      <div class="count" id="count">
        Carregando pedidos...
      </div>

      <div class="filters" id="filters">
        <button class="active" data-filter="novos">
          Novos
        </button>

        <button data-filter="impressos">
          Já impressos
        </button>
      </div>

    </div>

    <section class="orders" id="orders">
      <div class="empty">
        Carregando...
      </div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL='https://dmmmfumdlvhrlqxbhkcd.supabase.co';

const SUPABASE_PUBLISHABLE_KEY='sb_publishable_AsI3TBXPc5D1KzEIinR4mA_yBw87nnb';

const db=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const PRINTED_TTL=24*60*60*1000;

let orders=[];
let channel=null;
let currentFilter='novos';

let printedMap=JSON.parse(
  localStorage.getItem('casa_do_crepe_printed_ids')||'{}'
);

if(Array.isArray(printedMap)){
  printedMap=Object.fromEntries(
    printedMap.map(id=>[id,Date.now()])
  );
}

function savePrinted(){
  localStorage.setItem(
    'casa_do_crepe_printed_ids',
    JSON.stringify(printedMap)
  );
}

function cleanupPrinted(){

  const now=Date.now();
  let changed=false;

  for(const id of Object.keys(printedMap)){

    if(now-Number(printedMap[id])>=PRINTED_TTL){

      delete printedMap[id];
      changed=true;

    }

  }

  if(changed)savePrinted();

}

function markPrinted(id){

  printedMap[id]=Date.now();

  savePrinted();

}

function isPrinted(id){

  const t=Number(printedMap[id]);

  return Number.isFinite(t)&&
    Date.now()-t<PRINTED_TTL;

}

cleanupPrinted();

setInterval(()=>{

  cleanupPrinted();

  render();

},60000);

const statusLabels={
  novo:'Novo',
  aceito:'Aceito',
  preparando:'Preparando',
  pronto:'Pronto',
  entregue:'Entregue',
  cancelado:'Cancelado'
};

const money=v=>Number(v||0).toLocaleString(
  'pt-BR',
  {
    style:'currency',
    currency:'BRL'
  }
);

const esc=s=>String(s??'').replace(
  /[&<>\"']/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '\"':'&quot;',
    "'":'&#039;'
  }[c])
);

function formatTime(v){

  return new Date(v).toLocaleString(
    'pt-BR',
    {
      dateStyle:'short',
      timeStyle:'short'
    }
  );

}

function toast(t){

  const e=document.getElementById('toast');

  e.textContent=t;

  e.classList.add('show');

  setTimeout(
    ()=>e.classList.remove('show'),
    3500
  );

}

function render(){

  const fresh=orders.filter(
    o=>!isPrinted(o.id)
  );

  const printed=orders.filter(
    o=>isPrinted(o.id)
  );

  const list=
    currentFilter==='novos'
      ?fresh
      :printed;

  document.getElementById('count').textContent=
    currentFilter==='novos'
      ?`${fresh.length} pedido${fresh.length===1?'':'s'} novo${fresh.length===1?'':'s'}`
      :`${printed.length} pedido${printed.length===1?'':'s'} já impresso${printed.length===1?'':'s'}`;

  const root=document.getElementById('orders');

  if(!list.length){

    root.innerHTML=
      currentFilter==='novos'
        ?'<div class="empty">Nenhum pedido novo.</div>'
        :'<div class="empty">Nenhum pedido já impresso.</div>';

    return;

  }

  root.innerHTML=
    list.map(
      o=>card(
        o,
        currentFilter==='impressos'
      )
    ).join('');

}

function cleanItemName(value){

  return String(value??'')
    .replace(/\s*\+\s*$/,'')
    .trim();

}

function printerText(value){

  return String(value??'')
    .replace(/[áàãâä]/gi,'a')
    .replace(/[éèêë]/gi,'e')
    .replace(/[íìîï]/gi,'i')
    .replace(/[óòõôö]/gi,'o')
    .replace(/[úùûü]/gi,'u')
    .replace(/[ç]/gi,'c')
    .replace(/[ñ]/gi,'n');

}

function cleanPrintedItemName(name,category){

  let text=cleanItemName(name);

  const cat=String(category??'');

  if(/\b\d+(?:[.,]\d+)?\s*ml\b/i.test(cat)){

    text=text
      .replace(
        /\s+\d+(?:[.,]\d+)?\s*ml\s*$/i,
        ''
      )
      .trim();

  }

  return text;

}

function card(o,printed){

  const items=o.order_items||[];

  const shortId=o.id
    .slice(0,6)
    .toUpperCase();

  return `
  <article class="card ${!printed&&o.status==='novo'?'new':''}">

    <div class="cardhead">

      <div>

        <div class="orderid">
          Pedido #${esc(shortId)}
        </div>

        <div class="time">
          ${formatTime(o.created_at)}
        </div>

      </div>

    </div>

    <div class="body">

      <div class="customer">
        ${esc(o.customer_name)}
      </div>

      <div class="address">
        ${esc(o.address)}
      </div>

      <ul class="items">

        ${items.map(i=>`

          <li class="item">

            <div class="cat">
              ${esc(i.category)}
            </div>

            <div>
              <span class="qty">
                ${i.quantity}×
              </span>

              ${esc(
                cleanItemName(i.item_name)
              )}

            </div>

            ${
              Array.isArray(i.addons)&&i.addons.length
              ?`
                <div class="addons">
                  Adicionais:
                  ${
                    i.addons
                      .map(
                        a=>esc(
                          typeof a==='string'
                            ?a
                            :(a.name||'')
                        )
                      )
                      .join(', ')
                  }
                </div>
              `
              :''
            }

          </li>

        `).join('')}

      </ul>

      <div class="total">
        <span>Total</span>
        <span>${money(o.total)}</span>
      </div>

    </div>

    <div class="actions">

      <button
        class="primary"
        onclick="printOrder('${o.id}')"
      >
        🖨️
        ${printed?'Reimprimir':'Imprimir'}
        pedido #${esc(shortId)}
      </button>

      ${
        !printed
        ?`
          <button
            class="cancel"
            onclick="cancelOrder('${o.id}')"
          >
            ❌ Cancelar
          </button>
        `
        :''
      }

    </div>

  </article>
  `;

}

async function printOrder(id){

  const o=orders.find(
    x=>x.id===id
  );

  if(!o)return;

  const shortId=id
    .slice(0,6)
    .toUpperCase();

  const content=[];

  content.push({
    type:'text',
    text:'CASA DO CREPE',
    align:'center',
    bold:true,
    size:'large'
  });

  content.push({
    type:'text',
    text:'PEDIDO #'+shortId,
    align:'center',
    bold:true
  });

  content.push({
    type:'divider'
  });

  content.push({
    type:'text',
    text:'Cliente: '+printerText(
      o.customer_name||''
    )
  });

  content.push({
    type:'text',
    text:'Endereco: '+printerText(
      o.address||''
    )
  });

  content.push({
    type:'divider'
  });

  const groups=[];
  const groupMap=new Map();

  (o.order_items||[]).forEach(i=>{

    const category=
      (i.category||'').trim()||
      'Itens';

    let group=
      groupMap.get(category);

    if(!group){

      group={
        category,
        items:[]
      };

      groupMap.set(
        category,
        group
      );

      groups.push(group);

    }

    let name=
      cleanPrintedItemName(
        i.item_name,
        i.category
      );

    let addons=
      Array.isArray(i.addons)
        ?i.addons
          .map(
            a=>typeof a==='string'
              ?a
              :(a&&a.name)||''
          )
          .filter(Boolean)
        :[];

    if(
      !addons.length &&
      name.includes(' + ')
    ){

      const parts=
        name.split(' + ');

      name=
        parts.shift().trim();

      const legacyAddons=
        parts.join(' + ').trim();

      if(legacyAddons){

        addons=
          legacyAddons
            .split(',')
            .map(
              x=>x.trim()
            )
            .filter(Boolean);

      }

    }

    group.items.push({

      quantity:Number(
        i.quantity||0
      ),

      name,

      subtotal:Number(
        i.subtotal||
        (
          (i.unit_price||0)*
          (i.quantity||0)
        )
      ),

      addons

    });

  });

  groups.forEach(
    (group,index)=>{

      content.push({

        type:'text',

        text:
          printerText(
            group.category
          ).toUpperCase(),

        bold:true

      });

      group.items.forEach(
        item=>{

          content.push({

            type:'row',

            left:
              `${item.quantity}x ${printerText(item.name)}`,

            right:
              money(item.subtotal),

            bold:true

          });

          if(item.addons.length){

            content.push({

              type:'text',

              text:
                'Adicionais: '+
                item.addons
                  .map(printerText)
                  .join(', ')

            });

          }

        }
      );

      if(index<groups.length-1){

        content.push({
          type:'divider'
        });

      }

    }
  );

  content.push({
    type:'divider'
  });

  content.push({

    type:'row',

    left:'TOTAL',

    right:money(o.total),

    bold:true

  });

  content.push({
    type:'feed',
    lines:3
  });

  try{

    const resp=
      await fetch(
        'http://localhost:9100/print',
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/json'
          },
          body:JSON.stringify({
            content,
            paperWidth:58,
            cut:true
          })
        }
      );

    if(!resp.ok){

      throw new Error(
        'HTTP '+resp.status
      );

    }

    markPrinted(id);

    render();

    toast(
      '✓ Pedido #'+
      shortId+
      ' enviado para a impressora'
    );

  }catch(err){

    console.error(err);

    toast(
      'Não conectou ao app de impressão. '+
      'Abra o Cleanter e selecione a Mprinter-58MMB.'
    );

  }

}

async function cancelOrder(id){

  if(
    !confirm(
      'Cancelar este pedido?'
    )
  )return;

  const {error}=
    await db
      .from('orders')
      .update({
        status:'cancelado'
      })
      .eq('id',id);

  if(error){

    toast(
      'Não foi possível cancelar o pedido.'
    );

    console.error(error);

    return;

  }

  orders=
    orders.filter(
      x=>x.id!==id
    );

  render();

  toast(
    'Pedido cancelado'
  );

}

async function load(){

  const {data,error}=
    await db
      .from('orders')
      .select(
        'id,customer_name,address,total,status,created_at,order_items(id,category,item_name,quantity,unit_price,subtotal,addons)'
      )
      .neq(
        'status',
        'cancelado'
      )
      .order(
        'created_at',
        {
          ascending:false
        }
      );

  if(error){

    document.getElementById(
      'orders'
    ).innerHTML=
      '<div class="empty">'+
      'Não foi possível carregar os pedidos. '+
      'Verifique sua sessão e a conexão.'+
      '</div>';

    console.error(error);

    return;

  }

  orders=data||[];

  render();

}

async function setStatus(id,status){

  const {error}=
    await db
      .from('orders')
      .update({status})
      .eq('id',id);

  if(error){

    toast(
      'Não foi possível atualizar o pedido.'
    );

    console.error(error);

    return;

  }

  const o=
    orders.find(
      x=>x.id===id
    );

  if(o)o.status=status;

  render();

  toast(
    `Pedido atualizado: ${statusLabels[status]}`
  );

}

async function startPanel(){

  document
    .getElementById('loginScreen')
    .classList
    .add('hidden');

  document
    .getElementById('app')
    .classList
    .remove('hidden');

  await load();

  if(channel){

    await db.removeChannel(
      channel
    );

  }

  channel=
    db
      .channel(
        'cozinha-pedidos'
      )

      .on(
        'postgres_changes',
        {
          event:'INSERT',
          schema:'public',
          table:'orders'
        },
        async()=>{
          await load();
          toast(
            '🔔 Novo pedido recebido!'
          );
        }
      )

      .on(
        'postgres_changes',
        {
          event:'UPDATE',
          schema:'public',
          table:'orders'
        },
        async()=>{
          await load();
        }
      )

      .subscribe(
        status=>{
          if(
            status==='SUBSCRIBED'
          ){
            toast(
              'Conectado ao tempo real'
            );
          }
        }
      );

}

function showLogin(msg=''){

  document
    .getElementById('app')
    .classList
    .add('hidden');

  document
    .getElementById('loginScreen')
    .classList
    .remove('hidden');

  document
    .getElementById('loginError')
    .textContent=msg;

  document
    .getElementById('password')
    .value='';

  if(channel){

    db.removeChannel(
      channel
    );

    channel=null;

  }

}

document
  .getElementById('loginForm')
  .addEventListener(
    'submit',
    async e=>{

      e.preventDefault();

      const email=
        document
          .getElementById('email')
          .value
          .trim();

      const password=
        document
          .getElementById('password')
          .value;

      const err=
        document
          .getElementById(
            'loginError'
          );

      err.textContent=
        'Entrando...';

      const {error}=
        await db.auth
          .signInWithPassword({
            email,
            password
          });

      if(error){

        err.textContent=
          'E-mail ou senha incorretos.';

        console.error(error);

        return;

      }

      err.textContent='';

    }
  );

document
  .getElementById('filters')
  .addEventListener(
    'click',
    e=>{

      const b=
        e.target.closest(
          'button'
        );

      if(!b)return;

      document
        .querySelectorAll(
          '#filters button'
        )
        .forEach(
          x=>x.classList.remove(
            'active'
          )
        );

      b.classList.add('active');

      currentFilter=
        b.dataset.filter;

      render();

    }
  );

document
  .getElementById('logoutBtn')
  .addEventListener(
    'click',
    async()=>{

      await db.auth.signOut();

      showLogin('');

    }
  );

db.auth.onAuthStateChange(
  (event,session)=>{

    if(session)
      startPanel();
    else
      showLogin('');

  }
);

(async()=>{

  const {data}=
    await db.auth.getSession();

  if(data.session)
    startPanel();
  else
    showLogin('');

})();

</script>

</body>
</html>
